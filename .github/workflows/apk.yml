name: APK Android
# Compile l'appli Android de DysOrga (dossier android/) et la met à télécharger dans l'onglet Actions.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: DysOrga-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
