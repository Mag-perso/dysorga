name: Mise en ligne
# Installe le serveur Supabase (tables si absentes, clés, fonctions, planificateur) puis publie l'appli sur GitHub Pages.
# À régler une fois dans Settings > Secrets and variables > Actions :
#   secrets   SUPABASE_ACCESS_TOKEN, ANTHROPIC_API_KEY
#   variable  SUPABASE_PROJECT_REF
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false
env:
  REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
jobs:
  serveur:
    runs-on: ubuntu-latest
    outputs:
      anon: ${{ steps.cles.outputs.anon }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vérifier les réglages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$REF" ] || { echo "::error::Variable SUPABASE_PROJECT_REF manquante"; exit 1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Secret ANTHROPIC_API_KEY manquant"; exit 1; }
      - name: Base de données (seulement si elle est vide)
        run: |
          sql() { jq -n --arg q "$1" '{query:$q}' | curl -fsS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-; }
          if sql "select to_regclass('public.familles') is null as vide" | grep -q '"vide":true'; then
            sql "$(cat supabase/migrations/0001_init.sql)" > /dev/null && echo "Tables créées"
          else
            echo "Tables déjà là"
          fi
          # Corrections de données sans effet si déjà faites.
          sql "$(cat supabase/migrations/0002_doublons_pronote.sql)" > /dev/null && echo "Doublons Pronote retirés"
      - name: Clés du serveur
        run: |
          if ! supabase secrets list --project-ref "$REF" | grep -q VAPID_PUBLIC_KEY; then
            k=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
            supabase secrets set --project-ref "$REF" \
              VAPID_PUBLIC_KEY="$(jq -r .publicKey <<<"$k")" VAPID_PRIVATE_KEY="$(jq -r .privateKey <<<"$k")"
          fi
          s=$(openssl rand -hex 32)
          echo "::add-mask::$s"
          echo "CRON_SECRET=$s" >> "$GITHUB_ENV"
      - name: Fonctions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          supabase secrets set --project-ref "$REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" CRON_SECRET="$CRON_SECRET"
          # Chaque fonction vérifie elle-même qui l'appelle (connexion ou secret du planificateur).
          for f in assistant pronote rappels compte-enfant config; do
            supabase functions deploy "$f" --project-ref "$REF" --no-verify-jwt --use-api
          done
      - name: Planificateur
        run: |
          q=$(sed -e "s|__URL__|https://$REF.supabase.co|g" -e "s|__SECRET__|$CRON_SECRET|g" supabase/cron.sql)
          jq -n --arg q "$q" '{query:$q}' | curl -fsS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- > /dev/null
      - id: cles
        name: Clé publique de l'appli
        run: |
          anon=$(curl -fsS "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '(map(select(.type=="publishable"))[0].api_key) // (map(select(.name=="anon"))[0].api_key)')
          [ -n "$anon" ] && [ "$anon" != "null" ] || { echo "::error::Clé publique introuvable"; exit 1; }
          echo "anon=$anon" >> "$GITHUB_OUTPUT"
  appli:
    needs: serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ needs.serveur.outputs.anon }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publier:
    needs: appli
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
