name: Diagnostic Pronote
# Temporaire : n'affiche que des nombres et le message d'erreur de synchro (dépôt public, aucune donnée d'Ethan).
on:
  push:
    branches: [diag-pronote-page]
permissions:
  contents: read
jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: État de la synchro
        run: |
          q="select (select count(*) from devoirs where source='pronote' and fait) devoirs_faits,
            (select count(*) from devoirs where source='pronote' and pour >= (now() at time zone 'Europe/Paris')::date) devoirs_a_venir,
            (select min(pour)::text||' -> '||max(pour)::text from devoirs where source='pronote') dates_devoirs,
            (select string_agg(jour::text||' '||fin::text, ', ' order by jour) from emploi_du_temps) edt"
          jq -n --arg q "$q" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq .
