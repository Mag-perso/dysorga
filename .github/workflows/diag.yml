name: Diagnostic Pronote
# Temporaire : n'affiche que des nombres et le message d'erreur de synchro (dépôt public, aucune donnée d'Ethan).
on:
  push:
    branches: [diag-pronote-page]
permissions:
  contents: read
jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: État de la synchro
        run: |
          q="select (select string_agg(role, ',') from membres) roles,
            (select derniere_connexion::text from suivi limit 1) derniere_connexion_enfant,
            (select derniere_activite::text from suivi limit 1) derniere_activite,
            (select count(*) from devoirs where pour >= current_date - 7) devoirs_recents,
            (select count(*) from devoirs where pour >= current_date - 7 and fait) faits,
            (select count(*) from devoirs where pour >= current_date - 7 and fait and fait_le is not null) faits_dans_dysorga,
            (select string_agg(jour::text || ':' || n, ', ' order by jour) from usage_assistant where jour >= current_date - 8) appels_assistant,
            (select max(derniere_synchro)::text from pronote_comptes) derniere_synchro"
          jq -n --arg q "$q" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq .
