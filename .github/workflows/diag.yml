name: Diagnostic Pronote
# Temporaire : n'affiche que des nombres et le message d'erreur de synchro (dépôt public, aucune donnée d'Ethan).
on:
  push:
    branches: [diag-pronote-page]
permissions:
  contents: read
jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: État de la synchro
        run: |
          q="with g as (select matiere, pour from devoirs where pour >= current_date group by 1,2 having count(*) > 1)
            select json_agg(json_build_object('groupe', dense_rank, 'debut40_identiques', d40, 'fait', fait, 'fait_le_vide', fait_le is null, 'cree', to_char(cree, 'MM-DD HH24:MI'), 'longueur', length(texte), 'similarite_avec_le_plus_recent', sim) order by dense_rank, cree) lignes from (
              select d.*, dense_rank() over (order by d.matiere, d.pour),
                count(*) over (partition by d.matiere, d.pour, left(d.texte, 40)) d40,
                round(length(regexp_replace(d.texte, '[^a-z]', '', 'gi'))::numeric / greatest(1, length(regexp_replace(first_value(d.texte) over (partition by d.matiere, d.pour order by d.cree desc), '[^a-z]', '', 'gi'))), 2) sim
              from devoirs d join g using (matiere, pour)) x"
          jq -n --arg q "$q" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq .
