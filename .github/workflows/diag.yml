name: Diagnostic Pronote
# Temporaire : n'affiche que des nombres et le message d'erreur de synchro (dépôt public, aucune donnée d'Ethan).
on:
  push:
    branches: [diag-pronote-page]
permissions:
  contents: read
jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: État de la synchro
        run: |
          q="select (select count(*) from devoirs where source='pronote') devoirs,
            (select count(distinct (matiere, texte, pour)) from devoirs where source='pronote') devoirs_distincts,
            (select count(*) from notes where source='pronote') notes,
            (select count(distinct (matiere, note, sur, chapitre, cree)) from notes where source='pronote') notes_distinctes,
            (select count(*) from documents) documents,
            (select count(distinct (matiere, titre, date, contenu)) from documents) documents_distincts,
            (select left(min(pronote_id),12)||' / '||left(max(pronote_id),12) from devoirs where source='pronote') exemple_ids,
            (select max(derniere_synchro)::text from pronote_comptes) derniere_synchro"
          jq -n --arg q "$q" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq .
