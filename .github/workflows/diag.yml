name: Diagnostic Pronote
# Temporaire : n'affiche que des nombres et le message d'erreur de synchro (dépôt public, aucune donnée d'Ethan).
on:
  push:
    branches: [diag-pronote-page]
permissions:
  contents: read
jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: État de la synchro
        run: |
          q="select (select count(*) from devoirs) total, (select count(*) from familles) familles,
            (select count(*) from (select 1 from devoirs group by famille_id, matiere, pour, texte having count(*) > 1) z) groupes_identiques,
            (select count(*) from (select 1 from devoirs group by famille_id, matiere, lower(regexp_replace(texte, '[^a-zA-Z]', '', 'g')) having count(*) > 1) z) memes_textes_dates_differentes,
            (select json_agg(json_build_object('n', n, 'dates', nd, 'source', s)) from (select count(*) n, count(distinct pour) nd, string_agg(distinct source, ',') s from devoirs group by famille_id, matiere, lower(regexp_replace(texte, '[^a-zA-Z]', '', 'g')) having count(*) > 1) z) detail"
          jq -n --arg q "$q" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq .
