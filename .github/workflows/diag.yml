name: Diagnostic Pronote
# Temporaire : n'affiche que des nombres et le message d'erreur de synchro (dépôt public, aucune donnée d'Ethan).
on:
  push:
    branches: [diag-pronote-page]
permissions:
  contents: read
jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: État de la synchro
        run: |
          q="with g as (select matiere, pour from devoirs where pour >= current_date group by 1,2 having count(*) > 1),
            x as (select d.*, dense_rank() over (order by d.matiere, d.pour) grp, lower(regexp_replace(d.texte, '[^a-zA-Z]', '', 'g')) l from devoirs d join g using (matiere, pour))
            select json_agg(json_build_object('groupe', a.grp, 'cree_a', to_char(a.cree,'MM-DD HH24'), 'cree_b', to_char(b.cree,'MM-DD HH24'),
              'lettres_identiques', a.l = b.l, 'a_contient_b', position(b.l in a.l) > 0, 'b_contient_a', position(a.l in b.l) > 0,
              'debut20_identique', left(a.l,20) = left(b.l,20), 'fin20_identique', right(a.l,20) = right(b.l,20))) paires
            from x a join x b on a.grp = b.grp and a.id < b.id"
          jq -n --arg q "$q" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @- | jq .
